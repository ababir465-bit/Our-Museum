<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Museum</title>
<style>
:root{--glass:#ffffffb8;--ink:#2a2622;--acc:#c2185b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:#18181cb8;--ink:#f1ece4}}
:root[data-theme="dark"]{--glass:#18181cb8;--ink:#f1ece4}
html,body{height:100%;margin:0;background:#000;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font:14px system-ui,sans-serif;border:0;border-radius:999px;padding:11px 16px;background:var(--glass);color:var(--ink);backdrop-filter:blur(8px)}
#load{position:fixed;inset:0;background:#000;color:#f3ece0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;text-align:center}
#load h1{font:400 48px Georgia,serif;margin:0}
#load .by{font:italic 17px Georgia,serif;opacity:.8}
#bar{width:230px;height:2px;background:#ffffff30}#fill{height:100%;width:0;background:#f3ece0}
#st{font-size:12px;opacity:.7;letter-spacing:.04em}
#go{display:none;background:#f3ece0;color:#111;padding:12px 38px}
#fs{color:#f3ece0;opacity:.6;font-size:12px;text-decoration:underline;cursor:pointer}
#joy{position:fixed;left:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:var(--glass);touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:var(--acc);opacity:.85}
#acts{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#bChat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#snd{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;z-index:30}
#view{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));display:none;background:var(--acc);color:#fff}
#cap{position:fixed;inset:0;display:none;z-index:10;align-items:flex-end;justify-content:center;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
#cap span{font:italic 20px Georgia,serif;color:#fff;background:#000a;padding:10px 20px;border-radius:14px;margin:0 16px;text-align:center}
.viewing #joy,.viewing #acts,.viewing #bChat,.viewing #view{display:none!important}
#panel{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:6px;z-index:8}
#panel.open{display:flex}.chatting #joy,.chatting #acts,.chatting #bChat,.chatting #view{display:none!important}
#hist{max-height:30vh;overflow-y:auto;background:var(--glass);color:var(--ink);border-radius:14px;padding:8px 12px;font-size:14px;backdrop-filter:blur(8px);user-select:text}
#cf{display:flex;gap:6px}#ci{flex:1;min-width:0;border:0;border-radius:999px;padding:12px 16px;font:16px system-ui,sans-serif;background:var(--glass);color:var(--ink);outline:0}
#bub,#bubR{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#222;padding:7px 13px;border-radius:14px;font-size:14px;max-width:60vw;text-align:center;display:none;pointer-events:none;z-index:5;box-shadow:0 2px 8px #0003}
#lobby{position:fixed;inset:0;background:#000;color:#f3ece0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:19;padding:24px}
#lobby h2{font:400 36px Georgia,serif;margin:0 0 8px}
#lobby input,#lobby select{font:16px system-ui,sans-serif;padding:12px 16px;border-radius:999px;border:1px solid #fff4;background:#111;color:#f3ece0;width:210px;text-align:center;outline:0;box-sizing:border-box}
#cd{text-transform:uppercase;letter-spacing:.3em;width:120px!important}
#lobby .row{display:flex;gap:8px;align-items:center}#lobby button{background:#f3ece0;color:#111}#lmsg{font-size:13px;opacity:.8;min-height:16px}
#badge{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));display:none;background:var(--glass);color:var(--ink);padding:7px 14px;border-radius:999px;font-size:12px;z-index:6}
#net{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:none;background:#c2185b;color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;z-index:31}
#upl{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;z-index:11}.viewing #upl{display:block}
#vol{width:80px;accent-color:var(--acc)}
</style>
</head>
<body>
<div id="load"><h1>Our Museum</h1><div class="by" id="by"></div>
<div id="bar"><div id="fill"></div></div><div id="st">Turning on the lights &middot; 0%</div>
<button id="go">Start</button><div id="fs">Open in full screen</div></div>
<div id="lobby"><h2>Our Museum</h2><input id="nm" placeholder="Your name" maxlength="14"><select id="sty"><option value="boy">Boy avatar</option><option value="girl">Girl avatar</option></select>
<button id="mk">Create Room</button><div>or</div><div class="row"><input id="cd" placeholder="CODE" maxlength="4"><button id="jn">Join Room</button></div><div id="lmsg"></div></div>
<div id="badge"></div><div id="net">Reconnecting…</div>
<div id="joy"><div id="knob"></div></div>
<div id="acts"><button id="bSit">🪑 Sit</button><button id="bDance">💃 Dance</button><button id="bZoom">🔍 Zoom</button></div>
<button id="view">Tap to view</button><button id="bChat">💬 Chat</button><div id="snd"><button id="bMute">🔊</button><input id="vol" type="range" min="0" max="1" step=".05" value=".5"></div>
<button id="upl">📷 Change photo</button><input id="file" type="file" accept="image/*" hidden><div id="cap"><span id="capt"></span></div><div id="bub"></div><div id="bubR"></div>
<div id="panel"><div id="hist"></div><form id="cf"><input id="ci" maxlength="140" placeholder="Type a message…" autocomplete="off"><button type="submit">Send</button><button type="button" id="bClose">✕</button></form></div>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============ CONFIG — CHANGE EVERYTHING HERE ============ */
const CONFIG={
  FROM:'Shimul', TO:'Mithy',   // ← names on the loading screen (each player types their own name in the lobby)
  AVATAR:'boy',                // ← default avatar in the lobby: 'boy' or 'girl'
  // ← MUSIC: put your mp3 inside the "public" folder (example: public/song.mp3) and write 'song.mp3' here,
  //   or paste a direct .mp3 link. A YouTube link CANNOT play here (YouTube pages are not audio files).
  MUSIC_FILE:'20947.mp3',
  MUSIC_START:10,              // ← skip the first 10 seconds (also used every time the song loops)
  // ← PHOTOS: add or delete lines freely (up to 26 frames fit). size: 's' small, 'm' medium, 'l' large.
  //   src:'' = placeholder. For real photos put files in public/photos/ and write src:'photos/us1.jpg'. caption shows in photo view.
  PHOTOS:[
    {src:'',caption:'The day we met',size:'l'},{src:'',caption:'Our first trip',size:'m'},{src:'',caption:'Sunday mornings',size:'s'},
    {src:'',caption:'Your favourite smile',size:'m'},{src:'',caption:'Late-night talks',size:'l'},{src:'',caption:'Our song',size:'s'},
    {src:'',caption:'Where we got lost',size:'m'},{src:'',caption:'Always you',size:'l'},{src:'',caption:'Rainy walks',size:'s'},
    {src:'',caption:'Coffee dates',size:'m'},{src:'',caption:'Your birthday',size:'l'},{src:'',caption:'Matching hoodies',size:'s'},
    {src:'',caption:'The sunset',size:'m'},{src:'',caption:'Road trip',size:'l'},{src:'',caption:'Silly faces',size:'s'},
    {src:'',caption:'Our home',size:'m'},{src:'',caption:'Dancing in the kitchen',size:'l'},{src:'',caption:'Snow day',size:'s'},
    {src:'',caption:'First movie',size:'m'},{src:'',caption:'Birthday cake',size:'s'},{src:'',caption:'Holding hands',size:'l'},
    {src:'',caption:'Us, forever',size:'m'}
  ]
};
/* ======================================================= */
const $=id=>document.getElementById(id);
$('by').textContent='From '+CONFIG.FROM+'   To '+CONFIG.TO;

// ---- photo canvases (placeholders or your images) ----
const PW=384,PH=512;let loaded=0;const N=CONFIG.PHOTOS.length;
const pcs=CONFIG.PHOTOS.map(()=>{const c=document.createElement('canvas');c.width=PW;c.height=PH;return c});
const texs=[];
function ph(g,i){const p=['#f6c1d1','#c9d8f0','#f7e2b5','#cfe8d5','#e4cdf0','#f3d1b8','#d4e3ee','#f0c8dc'][i%8];
  g.fillStyle=p;g.fillRect(0,0,PW,PH);g.fillStyle='#fff';g.textAlign='center';g.font='150px serif';g.fillText('♥',PW/2,PH/2+50);
  g.font='20px sans-serif';g.fillText('Photo '+(i+1),PW/2,PH/2+95)}
function cover(g,im){const s=Math.max(PW/im.width,PH/im.height),w=im.width*s,h=im.height*s;g.drawImage(im,(PW-w)/2,(PH-h)/2,w,h)}
CONFIG.PHOTOS.forEach((p,i)=>{const g=pcs[i].getContext('2d');
  const done=()=>{loaded++;if(texs[i])texs[i].needsUpdate=true};
  if(!p.src){ph(g,i);return done()}
  const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{cover(g,im);done()};im.onerror=()=>{ph(g,i);done()};im.src=p.src});

// ---- renderer / scene ----
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.6));
R.shadowMap.enabled=true;document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x0b0b0e);
const C=new THREE.PerspectiveCamera(60,1,.1,80);
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const M=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},o));
S.add(new THREE.HemisphereLight(0xfff6ea,0xc9b8a0,.85));
const sun=new THREE.DirectionalLight(0xffffff,.45);sun.position.set(6,14,7);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,far:40});S.add(sun,sun.target);

const W=48,D=36,H=9;   // ← room size (2x wider/longer, higher ceiling)
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),M(0xf0e6d2));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;S.add(floor);
function wall(w,x,z,ry,c){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,H),M(c,{side:THREE.DoubleSide}));m.position.set(x,H/2,z);m.rotation.y=ry;S.add(m)}
wall(W,0,-D/2,0,0x141418);wall(W,0,D/2,0,0xfbf9f5);wall(D,-W/2,0,Math.PI/2,0xfbf9f5);wall(D,W/2,0,Math.PI/2,0xfbf9f5);
function spot(x,y,z,tx,ty,tz){const l=new THREE.SpotLight(0xfff0d8,1.0,45,.9,.7);l.position.set(x,y,z);l.target.position.set(tx,ty,tz);S.add(l,l.target)}
spot(-12,8.5,-8,-12,3.5,-18);spot(12,8.5,-8,12,3.5,-18);spot(-12,8.5,8,-12,3.5,18);spot(12,8.5,8,12,3.5,18);
const solids=[];   // collision boxes [minx,maxx,minz,maxz]; walls are handled by the room bounds
function box(x,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;S.add(m);solids.push([x-w/2,x+w/2,z-d/2,z+d/2])}
box(W/2-1.4,0,2.8,.3,8,0xffffff);        // TV platform (right wall)
box(W/2-5.6,0,.8,.5,3.4,0x7a5a3c);       // bench in front of the TV
const seats=[[W/2-5.65,-.9],[W/2-5.65,.9]];
// frames are placed automatically on free wall slots, spread across all four walls
const SZ={s:[1.5,2],m:[2.4,3.2],l:[3.3,4.4]},frames=[];
const glowT=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,2,32,32,32);
  r.addColorStop(0,'rgba(255,236,200,.35)');r.addColorStop(1,'rgba(255,236,200,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const SP=5.4,slots=[[],[],[],[]];
for(let x=-W/2+4;x<=W/2-4;x+=SP){slots[0].push([x,-D/2+.08,0]);slots[1].push([x,D/2-.08,Math.PI])}
for(let z=-D/2+4;z<=D/2-4;z+=SP){slots[2].push([-W/2+.08,z,Math.PI/2]);if(Math.abs(z)>5.5)slots[3].push([W/2-.08,z,-Math.PI/2])}
const order=[],tot=slots.reduce((a,b)=>a+b.length,0);for(let q=0;order.length<tot;q++)slots.forEach(a=>{if(a[q])order.push(a[q])});
function addFrame(i,[x,z,ry]){
  const [w,h]=SZ[CONFIG.PHOTOS[i].size]||SZ.m,y=2.2+h/2;
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;
  g.add(new THREE.Mesh(new THREE.BoxGeometry(w+.25,h+.25,.12),M(0xc9b48a)));
  const t=new THREE.CanvasTexture(pcs[i]);texs[i]=t;
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,color:0xf0f0f0}));p.position.z=.07;g.add(p);
  // a spotlight on every frame: small lamp + soft light wash (cheap, so it runs smoothly on phones)
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(.5,.12,.2),M(0x222222));lamp.position.set(0,h/2+.5,.35);g.add(lamp);
  const gl=new THREE.Mesh(new THREE.PlaneGeometry(w*2.2,h*1.9),new THREE.MeshBasicMaterial({map:glowT,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));gl.position.z=.09;g.add(gl);
  S.add(g);frames.push({pos:new THREE.Vector3(x,y,z),n:new THREE.Vector3(Math.sin(ry),0,Math.cos(ry)),i,w,h})}
order.slice(0,CONFIG.PHOTOS.length).forEach((s,i)=>addFrame(i,s));

// ---- TV slideshow ----
const tvc=document.createElement('canvas');tvc.width=640;tvc.height=360;const tg=tvc.getContext('2d');
const tvTex=new THREE.CanvasTexture(tvc);let slide=0;
function drawTV(){tg.fillStyle='#000';tg.fillRect(0,0,640,360);const s=360/PH;tg.drawImage(pcs[slide%N],(640-PW*s)/2,0,PW*s,360);
  tg.fillStyle='#000a';tg.fillRect(0,320,640,40);tg.fillStyle='#fff';tg.font='italic 20px Georgia';tg.textAlign='center';
  tg.fillText(CONFIG.PHOTOS[slide%N].caption,320,347);tvTex.needsUpdate=true}
setInterval(()=>{slide++;drawTV()},3500);drawTV();
{const g=new THREE.Group();g.position.set(W/2-.1,3.2,0);g.rotation.y=-Math.PI/2;
 g.add(new THREE.Mesh(new THREE.BoxGeometry(6.2,3.6,.15),M(0x0d0d0f)));
 const s=new THREE.Mesh(new THREE.PlaneGeometry(5.8,3.26),new THREE.MeshBasicMaterial({map:tvTex}));s.position.z=.08;g.add(s);S.add(g)}

// ---- avatar (low-poly, boy or girl) ----
function makeAvatar(girl){
  const g=new THREE.Group(),a={};
  const mesh=(geo,c,p,par=g)=>{const m=new THREE.Mesh(geo,M(c));m.position.set(...p);m.castShadow=true;par.add(m);return m};
  const skin=0xf1c9a5,top=girl?0xe58aa5:0x5a7fb5,bot=girl?0x7a5c8f:0x3b4252,hair=girl?0x4a2c1c:0x2a1f1a;
  a.hips=new THREE.Group();a.hips.position.y=.9;g.add(a.hips);
  mesh(new THREE.BoxGeometry(.6,.7,.36),top,[0,.35,0],a.hips);
  a.head=new THREE.Group();a.head.position.y=.95;a.hips.add(a.head);
  mesh(new THREE.SphereGeometry(.29,8,6),skin,[0,.2,0],a.head);
  mesh(new THREE.SphereGeometry(.32,8,6,0,6.3,0,1.8),hair,[0,.24,-.02],a.head);
  if(girl)mesh(new THREE.BoxGeometry(.5,.6,.16),hair,[0,.0,-.2],a.head);
  const limb=(w,l,c,x,y,par)=>{const p=new THREE.Group();p.position.set(x,y,0);par.add(p);mesh(new THREE.BoxGeometry(w,l,w+.04),c,[0,-l/2,0],p);return p};
  a.armL=limb(.15,.6,top,-.4,.62,a.hips);a.armR=limb(.15,.6,top,.4,.62,a.hips);
  a.legL=limb(.21,.85,bot,-.15,0,a.hips);a.legR=limb(.21,.85,bot,.15,0,a.hips);
  if(girl)mesh(new THREE.CylinderGeometry(.22,.4,.35,8),bot,[0,.05,0],a.hips);
  g.a=a;S.add(g);return g}
let av=makeAvatar(CONFIG.AVATAR==='girl');av.position.set(0,0,6);av.rotation.y=Math.PI;

function animate(av,mode,t){const a=av.a;
  a.hips.rotation.set(0,0,0);a.head.rotation.set(0,0,0);
  [a.armL,a.armR,a.legL,a.legR].forEach(p=>p.rotation.set(0,0,0));a.hips.position.y=.9;
  if(mode==='walk'){const s=Math.sin(t*9);a.legL.rotation.x=s*.8;a.legR.rotation.x=-s*.8;a.armL.rotation.x=-s*.7;a.armR.rotation.x=s*.7;a.hips.position.y=.9+Math.abs(Math.cos(t*9))*.05}
  else if(mode==='sit'){a.hips.position.y=av.onBench?.56:.36;a.legL.rotation.x=a.legR.rotation.x=-1.5;a.armL.rotation.x=a.armR.rotation.x=-.5}
  else if(mode==='dance'){const s=Math.sin(t*8);a.hips.position.y=.9+Math.abs(s)*.1;a.hips.rotation.z=s*.12;a.head.rotation.z=-s*.15;
    a.armL.rotation.z=-(2.4+s*.3);a.armR.rotation.z=2.4-s*.3;a.legL.rotation.x=s*.4;a.legR.rotation.x=-s*.4}
  else{a.hips.position.y=.9+Math.sin(t*2)*.012;a.armL.rotation.z=-.08-Math.sin(t*2)*.03;a.armR.rotation.z=.08+Math.sin(t*2)*.03}}

// ---- input ----
const keys={};let yaw=0,pitch=.38,dist=6,tdist=6;const typing=()=>document.activeElement===$('ci');
let mode='idle',viewing=null,started=false;
addEventListener('keydown',e=>{if(typing()||!started)return;const k=e.key.toLowerCase();keys[k]=1;
  if(e.key==='Escape')exitView();if(viewing)return;if(e.key===' '){e.preventDefault();toggleDance()}if(k==='e')toggleSit()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let jx=0,jz=0;const joy=$('joy'),kn=$('knob');
function jm(e){const r=joy.getBoundingClientRect();let dx=(e.clientX-r.left-60)/45,dy=(e.clientY-r.top-60)/45;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}jx=dx;jz=dy;kn.style.transform=`translate(${dx*34}px,${dy*34}px)`}
function je(){jx=jz=0;kn.style.transform=''}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);jm(e)});
joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))jm(e)});
joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
// camera drag: right side on touch, anywhere with a mouse
const cv=R.domElement;let lk=null;
cv.addEventListener('pointerdown',e=>{if(lk||(e.pointerType!=='mouse'&&e.clientX<innerWidth*.4))return;lk={id:e.pointerId,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!lk||e.pointerId!==lk.id||viewing)return;yaw-=(e.clientX-lk.x)*.006;pitch=Math.max(.05,Math.min(1.2,pitch+(e.clientY-lk.y)*.004));lk.x=e.clientX;lk.y=e.clientY});
const up=e=>{if(lk&&e.pointerId===lk.id)lk=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

// ---- actions ----
function stand(){if(av.onBench){av.position.x=W/2-6.8;av.onBench=false}mode='idle'}
function toggleSit(){if(viewing)return;if(mode==='sit')return stand();
  let b=null,bd=3.4;seats.forEach(s=>{const d=Math.hypot(s[0]-av.position.x,s[1]-av.position.z);if(d<bd){bd=d;b=s}});
  if(b){av.position.set(b[0],0,b[1]);av.rotation.y=Math.PI/2;av.onBench=true}mode='sit'}
function toggleDance(){if(viewing)return;if(mode==='sit')stand();mode=mode==='dance'?'idle':'dance'}
$('bSit').onclick=toggleSit;$('bDance').onclick=toggleDance;
$('bZoom').onclick=()=>{tdist=tdist>7?3:tdist>4?9:6};   // cycles close / normal / far
function enterView(f){viewing=f;document.body.classList.add('viewing');$('capt').textContent=CONFIG.PHOTOS[f.i].caption;$('cap').style.display='flex'}
function exitView(){viewing=null;document.body.classList.remove('viewing');$('cap').style.display='none'}
$('view').onclick=()=>{if(near)enterView(near)};$('cap').onclick=exitView;

// ---- chat (typed only, synced between both players) ----
const hist=$('hist');let bubT=0,myBub='',chatting=false;
function addMsg(n,tx){const d=document.createElement('div'),b=document.createElement('b');b.textContent=n+': ';d.append(b,tx);hist.appendChild(d);hist.scrollTop=1e9}
function chatOpen(o){chatting=o;$('panel').classList.toggle('open',o);document.body.classList.toggle('chatting',o);if(o)setTimeout(()=>$('ci').focus(),50);else $('ci').blur();applyVol()}
$('bChat').onclick=()=>chatOpen(true);$('bClose').onclick=()=>chatOpen(false);
$('cf').addEventListener('submit',e=>{e.preventDefault();const t=$('ci').value.trim();if(!t)return;$('ci').value='';
  addMsg(myName,t);myBub=t;bubT=performance.now()+4000;if(sock)sock.emit('chat',t)});

// ---- music: one global player, keeps playing from lobby into the room; quieter while chat is open ----
let AC,master,aud,muted=false;const vol=$('vol');
function applyVol(){const v=muted?0:vol.value*(chatting?.45:1);if(aud)aud.volume=Math.min(1,v);if(master)master.gain.value=v*.25}
function music(){if(AC||aud)return;const f=CONFIG.MUSIC_FILE;
  if(f&&!/youtu/i.test(f)){aud=new Audio(f);aud.onloadedmetadata=()=>{aud.currentTime=CONFIG.MUSIC_START||0};
    aud.onended=()=>{aud.currentTime=CONFIG.MUSIC_START||0;aud.play()};aud.play().catch(()=>{});applyVol();return}
  if(f)console.warn('YouTube links cannot be played. Use an mp3 file or a direct .mp3 link.');
  AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();
  const lp=AC.createBiquadFilter();lp.frequency.value=900;master.connect(lp);lp.connect(AC.destination);
  const ch=[[130.8,164.8,196,246.9],[110,164.8,196,261.6],[174.6,220,261.6,329.6],[98,146.8,196,246.9]];let n=0;
  const play=()=>{const t=AC.currentTime;ch[n++%4].forEach(fr=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=fr;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+2);g.gain.linearRampToValueAtTime(0,t+7.5);o.connect(g);g.connect(master);o.start(t);o.stop(t+8)})};
  applyVol();play();setInterval(play,6000)}
vol.oninput=applyVol;
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent=muted?'🔇':'🔊';applyVol()};

// ---- online: lobby, rooms, sync (Socket.io) ----
let sock=null,joined=false,roomCode='',myName='Guest',myStyle='boy',remote=null,lastSend=0;
$('nm').value=CONFIG.FROM;$('sty').value=CONFIG.AVATAR;
const lmsg=t=>$('lmsg').textContent=t;
function applyPhoto(i,data){const im=new Image();im.onload=()=>{cover(pcs[i].getContext('2d'),im);if(texs[i])texs[i].needsUpdate=true};im.src=data}
function removePeer(){if(remote){S.remove(remote.av);remote=null;$('bubR').style.display='none'}}
function addPeer(p){removePeer();const a=makeAvatar(p.style==='girl');a.position.set(av.position.x+2,0,av.position.z);remote={av:a,name:p.name,t:null,bubble:'',bt:0};addMsg('•',p.name+' joined')}
function onJoined(r){roomCode=r.code;joined=started=true;$('lobby').style.display='none';
  S.remove(av);av=makeAvatar(myStyle==='girl');av.position.set(r.slot?1.5:-1.5,0,14);av.rotation.y=Math.PI;
  $('badge').textContent='Room '+roomCode+' · tap to copy invite link';$('badge').style.display='block';
  Object.entries(r.photos).forEach(([i,d])=>applyPhoto(i,d));r.peers.forEach(addPeer)}
function rejoin(n){sock.emit('join',{name:myName,style:myStyle,code:roomCode},r=>{
  if(r.ok){$('net').style.display='none';removePeer();r.peers.forEach(addPeer);Object.entries(r.photos).forEach(([i,d])=>applyPhoto(i,d))}
  else if(n<8)setTimeout(()=>rejoin(n+1),2000);else $('net').textContent='Room closed — reload the page to start again'})}
function go(kind){myName=($('nm').value.trim()||'Guest').slice(0,14);myStyle=$('sty').value;
  if(!sock){sock=io({reconnectionDelay:800,reconnectionDelayMax:4000});
    sock.on('peer',addPeer);sock.on('peerleft',removePeer);sock.on('state',d=>{if(remote)remote.t=d});
    sock.on('chat',m=>{addMsg(m.name,m.text);if(remote){remote.bubble=m.text;remote.bt=performance.now()+4000}});
    sock.on('photo',d=>applyPhoto(d.idx,d.data));
    sock.on('disconnect',()=>{if(joined){$('net').textContent='Reconnecting…';$('net').style.display='block'}});
    sock.on('connect',()=>{if(joined)rejoin(0)});
    sock.on('connect_error',()=>{if(!joined)lmsg('Cannot reach the server…')})}
  lmsg('Connecting…');
  sock.emit(kind,{name:myName,style:myStyle,code:$('cd').value},r=>{if(r.ok)onJoined(r);else lmsg(r.error)})}
$('mk').onclick=()=>go('create');$('jn').onclick=()=>go('join');
const q=new URLSearchParams(location.search).get('room');if(q)$('cd').value=q.slice(0,4).toUpperCase();
$('badge').onclick=()=>{try{navigator.clipboard.writeText(location.origin+'/?room='+roomCode)}catch(e){}$('badge').textContent='Link copied ✓'};
// upload a photo into the frame you are viewing; the partner sees it instantly
$('upl').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f||!viewing)return;const i=viewing.i,u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{cover(pcs[i].getContext('2d'),im);texs[i].needsUpdate=true;URL.revokeObjectURL(u);if(sock&&joined)sock.emit('photo',{idx:i,data:pcs[i].toDataURL('image/jpeg',.75)})};im.src=u;e.target.value=''};

// ---- loading screen ----
let shown=0;const t0=performance.now();
(function ld(){if(started)return;const tgt=Math.min(loaded/N,(performance.now()-t0)/1500);shown+=(tgt-shown)*.1+.002;shown=Math.min(shown,tgt);
  $('fill').style.width=shown*100+'%';$('st').textContent='Turning on the lights · '+Math.round(shown*100)+'%';
  if(shown>=.995){$('go').style.display='block';$('st').textContent='Ready'}else requestAnimationFrame(ld)})();
$('go').onclick=()=>{$('load').style.display='none';$('lobby').style.display='flex';music()};
$('fs').onclick=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d)};

// ---- collision ----
function resolve(p){const m=.45;p.x=Math.max(-W/2+.7,Math.min(W/2-.7,p.x));p.z=Math.max(-D/2+.7,Math.min(D/2-.7,p.z));
  for(const [a,b,c,d] of solids)if(p.x>a-m&&p.x<b+m&&p.z>c-m&&p.z<d+m){
    const l=p.x-(a-m),r=b+m-p.x,t=p.z-(c-m),u=d+m-p.z,q=Math.min(l,r,t,u);
    if(q===l)p.x=a-m;else if(q===r)p.x=b+m;else if(q===t)p.z=c-m;else p.z=d+m}}

// ---- main loop ----
let near=null,last=performance.now();const cam=new THREE.Vector3(0,4,12),look=new THREE.Vector3(0,1.5,6),tc=new THREE.Vector3(),tl=new THREE.Vector3(),hv=new THREE.Vector3();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05),t=now/1000;last=now;
  let ix=jx,iz=jz;
  if(started&&!typing()&&!viewing){ix+=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);iz+=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)}
  else if(viewing||typing()){ix=iz=0}
  const l=Math.hypot(ix,iz);
  if(l>.12){if(mode==='sit')stand();mode='walk';ix/=Math.max(l,1);iz/=Math.max(l,1);
    const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw),mx=rx*ix-fx*iz,mz=rz*ix-fz*iz;
    av.position.x+=mx*4.2*dt;av.position.z+=mz*4.2*dt;resolve(av.position);
    let d=Math.atan2(mx,mz)-av.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));av.rotation.y+=d*Math.min(1,dt*12)}
  else if(mode==='walk')mode='idle';
  animate(av,mode,t);sun.position.set(av.position.x+6,14,av.position.z+7);sun.target.position.copy(av.position);
  if(remote&&remote.t){const d=remote.t,k=1-Math.exp(-dt*12),a=remote.av;a.position.x+=(d.x-a.position.x)*k;a.position.z+=(d.z-a.position.z)*k;
    let r=d.r-a.rotation.y;r=Math.atan2(Math.sin(r),Math.cos(r));a.rotation.y+=r*k;a.onBench=d.b;animate(a,d.m,t)}
  else if(remote)animate(remote.av,'idle',t);
  if(sock&&joined&&remote&&sock.connected&&now-lastSend>80){lastSend=now;sock.volatile.emit('state',{x:+av.position.x.toFixed(2),z:+av.position.z.toFixed(2),r:+av.rotation.y.toFixed(2),m:mode,b:!!av.onBench})}
  // nearest photo
  near=null;let bd=6;if(!viewing&&mode!=='sit')frames.forEach(f=>{hv.copy(av.position).sub(f.pos);hv.y=0;
    if(hv.dot(f.n)>0&&hv.length()<bd){bd=hv.length();near=f}});
  $('view').style.display=(near&&!viewing&&!document.body.classList.contains('chatting'))?'block':'none';
  // camera
  dist+=(tdist-dist)*Math.min(1,dt*6);
  if(viewing){const f=viewing,th=Math.tan(C.fov*Math.PI/360),d=Math.max((f.h/2+.2)/th,(f.w/2+.2)/(th*C.aspect))+.2;
    tc.copy(f.pos).addScaledVector(f.n,d);tl.copy(f.pos)}
  else{tl.set(av.position.x,1.5,av.position.z);const cp=Math.cos(pitch);
    tc.set(tl.x+Math.sin(yaw)*cp*dist,tl.y+Math.sin(pitch)*dist,tl.z+Math.cos(yaw)*cp*dist);
    tc.x=Math.max(-W/2+.3,Math.min(W/2-.3,tc.x));tc.z=Math.max(-D/2+.3,Math.min(D/2-.3,tc.z));tc.y=Math.max(.5,Math.min(H-.4,tc.y))}
  const k=1-Math.exp(-dt*(viewing?5:12));cam.lerp(tc,k);look.lerp(tl,k);C.position.copy(cam);C.lookAt(look);
  // speech bubbles (your own, and your partner's name/message)
  const pb=(el,p,txt,on)=>{if(on&&!viewing){hv.set(p.x,2.6,p.z).project(C);if(hv.z<1){el.textContent=txt;el.style.display='block';el.style.left=(hv.x*.5+.5)*innerWidth+'px';el.style.top=(-hv.y*.5+.5)*innerHeight+'px';return}}el.style.display='none'};
  pb($('bub'),av.position,myBub,now<bubT);if(remote)pb($('bubR'),remote.av.position,now<remote.bt?remote.bubble:remote.name,true);
  R.render(S,C)})(performance.now());
</script>
